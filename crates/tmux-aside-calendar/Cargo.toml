[package]
name = "tmux-aside-calendar"
description = "tmux-aside section listing upcoming events from the macOS Calendar"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.38"
serde_json = "1.0.154"
tmux-aside = { version = "0.1.0", path = "../tmux-aside" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-event-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "EKCalendar",
    "EKCalendarItem",
    "EKEvent",
    "EKEventStore",
    "EKObject",
    "EKParticipant",
    "EKTypes",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSDate",
    "NSEnumerator",
    "NSError",
    "NSPredicate",
    "NSString",
    "NSURL",
] }
