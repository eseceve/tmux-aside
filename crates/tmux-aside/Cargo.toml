[package]
name = "tmux-aside"
description = "A tmux sidebar with pluggable sections, shared by every window"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.38"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
unicode-width = "0.2.2"
